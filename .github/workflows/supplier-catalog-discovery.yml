name: Supplier catalog discovery
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/supplier-catalog-discovery.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe Dahaoshang public catalog
        run: |
          python - <<'PY'
          import json, re, urllib.parse, urllib.request, xml.etree.ElementTree as ET
          from html.parser import HTMLParser
          from datetime import datetime, timezone

          BASE = "https://dahaoshang.com/"
          HOST = "dahaoshang.com"
          headers = {"User-Agent": "Mozilla/5.0 (compatible; FakaBotCatalogDiscovery/1.0)", "Accept": "text/html,application/xhtml+xml,application/xml"}
          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True); self.links=[]; self.title=[]; self.in_title=False
                  self.forms=[]; self.form=None; self.text=[]; self.imgs=[]
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if tag=="title": self.in_title=True
                  if tag=="a" and a.get("href"): self.links.append(urllib.parse.urljoin(BASE,a["href"]))
                  if tag=="form":
                      self.form={"method":a.get("method","get"),"action":urllib.parse.urljoin(BASE,a.get("action","")),"fields":[]}; self.forms.append(self.form)
                  if tag=="input" and self.form is not None:
                      self.form["fields"].append({"name":a.get("name"),"type":a.get("type","text")})
                  if tag=="img" and a.get("src"): self.imgs.append(urllib.parse.urljoin(BASE,a["src"]))
              def handle_endtag(self, tag):
                  if tag=="title": self.in_title=False
                  if tag=="form": self.form=None
              def handle_data(self, data):
                  if self.in_title: self.title.append(data.strip())
                  if data.strip(): self.text.append(data.strip())

          def get(url):
              try:
                  req=urllib.request.Request(url,headers=headers)
                  with urllib.request.urlopen(req,timeout=18) as r:
                      body=r.read(3_000_000)
                      return {"url":r.geturl(),"status":r.status,"type":r.headers.get("Content-Type",""),"body":body.decode(r.headers.get_content_charset() or "utf-8","replace")}
              except Exception as e: return {"url":url,"error":type(e).__name__+": "+str(e)[:250]}

          result={"checked_at":datetime.now(timezone.utc).isoformat(),"base":BASE,"pages":[],"sitemaps":[]}
          for path in ("robots.txt","sitemap.xml","sitemap_index.xml"):
              x=get(urllib.parse.urljoin(BASE,path))
              result["sitemaps"].append({k:v for k,v in x.items() if k!="body"})
              if x.get("body"):
                  for loc in re.findall(r"<loc>\\s*(.*?)\\s*</loc>",x["body"],re.I):
                      if loc.startswith("https://"+HOST): result.setdefault("sitemap_urls",[]).append(loc)
                  for sm in re.findall(r"(?im)^\\s*Sitemap:\\s*(\\S+)",x["body"]): result.setdefault("sitemap_refs",[]).append(sm)
          urls=[BASE]+result.get("sitemap_urls",[])[:80]
          for url in list(dict.fromkeys(urls))[:60]:
              x=get(url)
              if not x.get("body"):
                  result["pages"].append({k:v for k,v in x.items() if k!="body"}); continue
              p=Parser(); p.feed(x["body"])
              internal=[]
              for link in p.links:
                  u=urllib.parse.urlsplit(link)
                  if u.scheme in ("http","https") and u.netloc.lower().endswith(HOST):
                      internal.append(link)
              products=[u for u in internal if re.search(r"(product|goods|item|detail|category|catalog|shop|account|facebook|instagram|telegram|microsoft|teams)",u,re.I)]
              result["pages"].append({"url":x["url"],"status":x["status"],"type":x["type"],"bytes":len(x["body"]),"title":" ".join(p.title)[:250],"links":list(dict.fromkeys(internal))[:250],"candidate_product_links":list(dict.fromkeys(products))[:150],"forms":p.forms[:20],"images":p.imgs[:80],"text_excerpt":" ".join(p.text)[:2500]})
          print(json.dumps(result,ensure_ascii=False))
          with open("supplier-catalog-discovery.json","w",encoding="utf-8") as f: json.dump(result,f,ensure_ascii=False,indent=2)
          PY
      - name: Upload discovery report
        uses: actions/upload-artifact@v4
        with:
          name: supplier-catalog-discovery
          path: supplier-catalog-discovery.json
          retention-days: 2
