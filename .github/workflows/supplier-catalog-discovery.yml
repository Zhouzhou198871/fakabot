name: Supplier catalog discovery
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Inspect site app and public catalog endpoints
        run: |
          python - <<'PY'
          import json, re, urllib.parse, urllib.request
          from datetime import datetime, timezone
          from html.parser import HTMLParser

          BASE = "https://dahaoshang.com/"
          HOST = "dahaoshang.com"
          HEADERS = {"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130 Safari/537.36","Accept":"text/html,application/xhtml+xml,application/javascript,application/json,*/*"}
          def get(url, limit=4_000_000):
              try:
                  req=urllib.request.Request(url,headers=HEADERS)
                  with urllib.request.urlopen(req,timeout=20) as r:
                      raw=r.read(limit)
                      return {"url":r.geturl(),"status":r.status,"type":r.headers.get("Content-Type",""),"body":raw.decode(r.headers.get_content_charset() or "utf-8","replace")}
              except Exception as e:
                  return {"url":url,"error":type(e).__name__+": "+str(e)[:300]}
          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.title=[]; self.in_title=False; self.scripts=[]; self.links=[]; self.imgs=[]
              def handle_starttag(self,t,attrs):
                  a=dict(attrs)
                  if t=="title": self.in_title=True
                  if t=="script" and a.get("src"): self.scripts.append(urllib.parse.urljoin(BASE,a["src"]))
                  if t=="a" and a.get("href"): self.links.append(urllib.parse.urljoin(BASE,a["href"]))
                  if t=="img" and a.get("src"): self.imgs.append(urllib.parse.urljoin(BASE,a["src"]))
              def handle_endtag(self,t):
                  if t=="title": self.in_title=False
              def handle_data(self,d):
                  if self.in_title: self.title.append(d.strip())

          result={"checked_at":datetime.now(timezone.utc).isoformat(),"base":BASE,"sitemaps":[],"app_scripts":[],"api_candidates":[],"pages":[]}
          for path in ("robots.txt","sitemap.xml","sitemap_index.xml"):
              x=get(urllib.parse.urljoin(BASE,path),500000)
              result["sitemaps"].append({k:v for k,v in x.items() if k!="body"})
              if x.get("body"):
                  result["sitemaps"][-1]["excerpt"]=x["body"][:3000]
          home=get(BASE)
          if home.get("body"):
              p=P(); p.feed(home["body"])
              result["home"]={k:v for k,v in home.items() if k!="body"}
              result["home"]["title"]=" ".join(p.title)
              result["home"]["scripts"]=p.scripts[:80]
              result["home"]["links"]=p.links[:200]
              result["home"]["images"]=p.imgs[:80]
              result["home"]["html_excerpt"]=home["body"][:1800]
              for src in p.scripts[:25]:
                  js=get(src,3_000_000)
                  entry={k:v for k,v in js.items() if k!="body"}
                  if js.get("body"):
                      body=js["body"]
                      patterns=[r"https?://[^\\s\"'<>]+",r"['\"](/[^'\"\\s]*(?:api|product|goods|catalog|login)[^'\"\\s]*)['\"]",r"['\"]([^'\"\\s]*(?:products|goods|catalog|category|login)[^'\"\\s]*)['\"]"]
                      found=[]
                      for pat in patterns:
                          found += re.findall(pat,body,re.I)
                      entry["interesting_strings"]=list(dict.fromkeys(found))[:160]
                      entry["keyword_hits"]={k:len(re.findall(k,body,re.I)) for k in ("axios","baseURL","/api","product","goods","catalog","login","graphql","Authorization")}
                      snippets=[]
                      for needle in ("baseURL","axios.create","/api/","Authorization","productList","getProducts","products"):
                          for m in list(re.finditer(re.escape(needle),body,re.I))[:12]:
                              snippets.append({"needle":needle,"context":body[max(0,m.start()-350):min(len(body),m.end()+500)]})
                      entry["code_contexts"]=snippets[:100]
                      api_matches=list(re.finditer(r"""["'](/api/[^"']+)["']""",body))
                      entry["api_functions"]=[{"context":body[max(0,m.start()-220):min(len(body),m.end()+600)]} for m in api_matches[:250]]
                      entry["all_api_paths"]=list(dict.fromkeys(m.group(1) for m in api_matches))[:300]
                      entry["js_excerpt"]=body[:500] if not found else ""
                      for s in found:
                          if s.startswith("/") and not s.startswith("//") and re.search(r"(api|product|goods|catalog|login)",s,re.I):
                              result["api_candidates"].append(urllib.parse.urljoin(BASE,s))
                          elif s.startswith("http") and HOST in urllib.parse.urlsplit(s).netloc:
                              result["api_candidates"].append(s)
                  result["app_scripts"].append(entry)
          result["public_catalog_api"]=[]
          for path in ("/api/syscategory/getcategorylist","/api/syssite/getsite","/api/sysproduct/getproductlist?categoryId=0","/api/sysproduct/getproductlist?categoryId=1","/api/sysproduct/getproduct?productId=1510103661516505382"):
              x=get(urllib.parse.urljoin(BASE,path),2_000_000)
              body=x.pop("body","")
              entry={**x,"body_excerpt":body[:12000]}
              try:
                  entry["json"]=json.loads(body)
              except Exception:
                  entry["json_parse_error"]=True
              result["public_catalog_api"].append(entry)
          candidates=list(dict.fromkeys(result["api_candidates"]))[:50]
          result["api_probes"]=[]
          for url in candidates:
              x=get(url,1_500_000)
              body=x.pop("body","")
              result["api_probes"].append({**x,"body_excerpt":body[:3500],"json_like":body.lstrip().startswith(("{","["))})
          api_by_path={urllib.parse.urlsplit(a["url"]).path + (("?"+urllib.parse.urlsplit(a["url"]).query) if urllib.parse.urlsplit(a["url"]).query else ""):a for a in result["public_catalog_api"]}
          category_payload=api_by_path.get("/api/syscategory/getcategorylist",{}).get("json",{}).get("Data",[])
          product_payload=api_by_path.get("/api/sysproduct/getproductlist?categoryId=0",{}).get("json",{}).get("Data",[])
          category_map={str(c.get("ID")):c for c in category_payload}
          catalog={
              "source":"https://dahaoshang.com/api/sysproduct/getproductlist?categoryId=0",
              "fetched_at":result["checked_at"],
              "price_currency":"CNY",
              "categories":[{"id":str(c.get("ID","")),"name":c.get("Name",""),"alias":c.get("Alias",""),"icon":c.get("Icon",""),"count":int(c.get("Count",0) or 0),"enabled":bool(c.get("IsEnable"))} for c in category_payload],
              "products":[
                  {"id":str(p.get("ID","")),"supplier_product_id":str(p.get("ID","")),"name":p.get("Name",""),"icon":p.get("Icon",""),"price_cny":p.get("Price"),"stock":int(p.get("InStock",0) or 0),"category_id":str(p.get("CategoryId","")),"category_name":category_map.get(str(p.get("CategoryId","")),{}).get("Name",""),"is_on_sale":bool(p.get("IsOnSale")),"is_recommend":bool(p.get("IsRecommend")),"is_hot":bool(p.get("IsHot")),"is_remote":bool(p.get("IsRemote")),"remote_price":p.get("RemotePrice",0),"add_price_factor":p.get("AddPriceFactor",0),"min_buy":int(p.get("MinBuy",0) or 0),"max_buy":int(p.get("MaxBuy",0) or 0)}
                  for p in product_payload if p.get("ID") and p.get("Name")
              ]
          }
          import os
          os.makedirs("products",exist_ok=True)
          with open("products/upstream_catalog.json","w",encoding="utf-8") as f: json.dump(catalog,f,ensure_ascii=False,separators=(",",":"))
          result["catalog_summary"]={"category_count":len(catalog["categories"]),"product_count":len(catalog["products"]),"on_sale_count":sum(1 for p in catalog["products"] if p["is_on_sale"]),"positive_stock_count":sum(1 for p in catalog["products"] if p["stock"]>0)}
          with open("supplier-catalog-discovery.json","w",encoding="utf-8") as f: json.dump(result,f,ensure_ascii=False,indent=2)
          print(json.dumps({"catalog_summary":result["catalog_summary"],"categories":catalog["categories"]},ensure_ascii=False))
          PY
      - name: Upload discovery report
        uses: actions/upload-artifact@v4
        with:
          name: supplier-catalog-discovery
          path: supplier-catalog-discovery.json
          retention-days: 2
      - name: Commit live upstream catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products/upstream_catalog.json
          if ! git diff --cached --quiet; then
            git commit -m "Sync live Dahaoshang product catalog [skip ci]"
            git push
          fi
