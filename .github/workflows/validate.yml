name: Validate Telegram bot
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile latest bot modules
        run: python -m py_compile bot.py payment_listener.py telegram_storage.py products/*.py
      - name: Check global two-column keyboard enforcement
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("bot.py").read_text(encoding="utf-8")
          assert "def enforce_two_column_keyboard(kb):" in source
          assert "buttons[index:index + 2]" in source
          assert "kwargs[\"reply_markup\"] = enforce_two_column_keyboard" in source
          assert "bot.edit_message_text = _edit_message_text_two_columns" in source
          print("Global two-column keyboard enforcement is wired.")
          PY

      - name: Verify Telegram-only persistence wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          bot = Path("bot.py").read_text(encoding="utf-8")
          store = Path("telegram_storage.py").read_text(encoding="utf-8")
          assert "TelegramArchiveStore" in bot
          assert "bot.infinity_polling(skip_pending=False" in bot
          assert "self.bot.pin_chat_message" in store
          assert "self.bot.download_file" in store
          assert "os.remove(path)" in store
          assert "open(path, \"w\"" not in bot
          print("Telegram private-channel persistence wiring verified.")
          PY

      - name: Install bot dependencies
        run: pip install -r requirements.txt

      - name: Test Telegram archive recovery and rollback
        run: python -m unittest discover -s tests -v

      - name: Smoke-test bot menu construction
        env:
          BOT_TOKEN: "123456:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghi"
        run: |
          python - <<'PY'
          import bot
          keyboard = bot.get_main_kb()
          assert len(keyboard.keyboard) == 3
          assert all(len(row) == 2 for row in keyboard.keyboard)
          assert all(button.callback_data for row in keyboard.keyboard for button in row)
          print("Bot import and six-button main menu construction passed.")
          PY

      - name: Verify Premium emoji rejection fallback
        env:
          BOT_TOKEN: "123456:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghi"
        run: |
          python - <<'PY'
          import bot

          original = bot._original_send_message
          calls = []

          def fake_send(*args, **kwargs):
              calls.append((args, kwargs))
              text = args[1] if len(args) > 1 else kwargs.get("text", "")
              markup = kwargs.get("reply_markup")
              if "<tg-emoji" in text:
                  raise RuntimeError("Bad Request: can't parse entities")
              if markup and any(
                  getattr(button, "icon_custom_emoji_id", None)
                  for row in markup.keyboard for button in row
              ):
                  raise RuntimeError("BUTTON_ICON_INVALID")
              return "ok"

          bot._original_send_message = fake_send
          try:
              result = bot.bot.send_message(
                  1, bot.premium_emoji("star", "✨"),
                  reply_markup=bot.get_main_kb()
              )
              assert result == "ok"
              assert len(calls) == 3
              final_text = calls[-1][0][1]
              final_markup = calls[-1][1]["reply_markup"]
              assert "<tg-emoji" not in final_text
              assert all(
                  not getattr(button, "icon_custom_emoji_id", None)
                  for row in final_markup.keyboard for button in row
              )
              print("Premium text and button icon rejection fallbacks passed.")
          finally:
              bot._original_send_message = original
          PY

      - name: Verify source bundle archive excludes business data and secrets
        env:
          BOT_TOKEN: "123456:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghi"
        run: |
          python - <<'PY'
          import io
          import zipfile
          from types import SimpleNamespace
          import bot

          class MemoryStore:
              def __init__(self):
                  self.meta = {}
              def load(self, key, default):
                  return dict(self.meta) if key == "meta" else default
              def save(self, key, value):
                  if key == "meta":
                      self.meta = dict(value)

          sent = []
          original_send = bot.bot.send_document
          original_store = bot.ARCHIVE_STORE

          def fake_send_document(chat_id, document, **kwargs):
              payload = document.read()
              with zipfile.ZipFile(io.BytesIO(payload)) as archive:
                  names = set(archive.namelist())
                  assert "bot.py" in names
                  assert "telegram_storage.py" in names
                  assert "users.json" not in names
                  assert "orders.json" not in names
                  assert not any(name.startswith(".env") for name in names)
              sent.append((chat_id, kwargs))
              return SimpleNamespace(message_id=7654321)

          bot.ARCHIVE_STORE = MemoryStore()
          bot.bot.send_document = fake_send_document
          try:
              assert bot.archive_source_bundle() is True
              assert len(sent) == 1
              assert bot.ARCHIVE_STORE.meta["source_bundle_message_id"] == 7654321
              assert bot.archive_source_bundle() is False
              print("Source bundle upload, exclusions, and deduplication passed.")
          finally:
              bot.bot.send_document = original_send
              bot.ARCHIVE_STORE = original_store
          PY
