name: Validate Telegram bot
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile latest bot modules
        run: python -m py_compile bot.py payment_listener.py telegram_storage.py
      - name: Check global two-column keyboard enforcement
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("bot.py").read_text(encoding="utf-8")
          assert "def enforce_two_column_keyboard(kb):" in source
          assert "buttons[index:index + 2]" in source
          assert "kwargs[\"reply_markup\"] = enforce_two_column_keyboard" in source
          assert "bot.edit_message_text = _edit_message_text_two_columns" in source
          print("Global two-column keyboard enforcement is wired.")
          PY

      - name: Verify Telegram-only persistence wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          bot = Path("bot.py").read_text(encoding="utf-8")
          store = Path("telegram_storage.py").read_text(encoding="utf-8")
          assert "TelegramArchiveStore" in bot
          assert "bot.infinity_polling(skip_pending=False" in bot
          assert "self.bot.pin_chat_message" in store
          assert "self.bot.download_file" in store
          assert "os.remove(path)" in store
          assert "open(path, \"w\"" not in bot
          print("Telegram private-channel persistence wiring verified.")
          PY

      - name: Test Telegram archive recovery and rollback
        run: python -m unittest discover -s tests -v
