name: Supplier catalog read-only probe
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/supplier-catalog-probe.yml"
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Read public supplier catalog entry points
        run: |
          python - <<'PY'
          import json, re
          from html.parser import HTMLParser
          from urllib.parse import urljoin
          import requests

          base = "https://dahaoshang.com/"
          s = requests.Session()
          s.headers.update({"User-Agent":"Mozilla/5.0 (compatible; CatalogReadOnlyProbe/1.0)", "Accept":"text/html,application/xhtml+xml"})
          r = s.get(base, timeout=25)
          r.raise_for_status()
          html = r.text

          class P(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.title=[]; self.links=[]; self.scripts=[]; self.forms=[]
                  self.in_title=False; self.form=None
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if tag=="title": self.in_title=True
                  if tag=="a" and a.get("href"): self.links.append(urljoin(r.url,a["href"]))
                  if tag=="script" and a.get("src"): self.scripts.append(urljoin(r.url,a["src"]))
                  if tag=="form":
                      self.form={"action":urljoin(r.url,a.get("action","")), "method":a.get("method","get").lower(), "fields":[]}
                      self.forms.append(self.form)
                  if tag=="input" and self.form is not None:
                      self.form["fields"].append({"name":a.get("name",""),"type":a.get("type","text")})
              def handle_endtag(self, tag):
                  if tag=="title": self.in_title=False
                  if tag=="form": self.form=None
              def handle_data(self, data):
                  if self.in_title and data.strip(): self.title.append(data.strip())

          p=P(); p.feed(html)
          assets=[]
          patterns=re.compile(r"""(?:"|')([^"']{0,180}(?:/api/|graphql|product|catalog|goods|item|category)[^"']{0,180})(?:"|')""", re.I)
          for u in list(dict.fromkeys(p.scripts))[:60]:
              try:
                  x=s.get(u, timeout=15)
                  if x.ok and ("javascript" in x.headers.get("content-type","") or u.endswith(".js")):
                      hits=list(dict.fromkeys(patterns.findall(x.text)))[:100]
                      if hits: assets.append({"url":u,"references":hits})
              except requests.RequestException:
                  pass
          out={
              "ok":True,"final_url":r.url,"status":r.status_code,
              "title":" ".join(p.title),"html_bytes":len(r.content),
              "links":list(dict.fromkeys(p.links))[:300],
              "scripts":list(dict.fromkeys(p.scripts))[:100],
              "forms":p.forms,"script_references":assets,
              "note":"Read-only unauthenticated GET only; no credentials, cookies, or purchase actions."
          }
          open("supplier_catalog_probe.json","w",encoding="utf-8").write(json.dumps(out,ensure_ascii=False,indent=2))
          print(json.dumps({k:out[k] for k in ("ok","final_url","status","title","html_bytes","links","scripts","script_references")},ensure_ascii=False))
          PY
      - name: Save probe result for catalog analysis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supplier_catalog_probe.json
          git diff --cached --quiet || git commit -m "chore: capture public supplier catalog endpoints"
          git push
